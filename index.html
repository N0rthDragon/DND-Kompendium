<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kompendium der Kampagne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181009;
    --ink-2:#241a10;
    --parchment:#ece0c4;
    --parchment-2:#ddcda3;
    --parchment-shadow:#8f7c53;
    --text:#2c2213;
    --text-soft:#5b4c34;
    --crimson:#8c2a34;
    --crimson-dark:#5e1c24;
    --gold:#bd9330;
    --gold-bright:#e0b74d;
    --forest:#3c5b3f;
    --violet:#5a4470;
    --radius:2px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #2a1d10 0%, var(--ink) 55%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.15) 0 2px, transparent 2px 6px);
    color:var(--parchment);
    font-family:'Spectral', serif;
    min-height:100vh;
  }

  /* ---------- Header : Buchdeckel ---------- */
  header{
    padding:64px 24px 40px;
    text-align:center;
    border-bottom:6px double var(--gold);
    background:linear-gradient(180deg, var(--ink-2), var(--ink));
    position:relative;
  }
  header::before, header::after{
    content:"";
    position:absolute; top:16px; bottom:16px; width:2px;
    background:linear-gradient(var(--gold), transparent 80%);
    opacity:.5;
  }
  header::before{left:16px;}
  header::after{right:16px;}

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    letter-spacing:.35em;
    text-transform:uppercase;
    font-size:.7rem;
    color:var(--gold-bright);
    margin:0 0 14px;
  }
  h1{
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size:clamp(2rem, 5vw, 3.4rem);
    margin:0;
    color:var(--parchment);
    text-shadow:0 2px 0 #000, 0 0 24px rgba(224,183,77,.25);
    letter-spacing:.03em;
  }
  .subtitle{
    font-style:italic;
    color:var(--parchment-2);
    opacity:.8;
    margin-top:12px;
    font-size:1rem;
  }

  /* ---------- Controls ---------- */
  .controls{
    max-width:1100px;
    margin:-26px auto 0;
    padding:0 24px;
    position:relative;
    z-index:2;
  }
  .search-wrap{
    background:var(--parchment);
    border:1px solid var(--parchment-shadow);
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .search-wrap svg{flex:none; opacity:.55;}
  #search{
    border:none;
    background:transparent;
    outline:none;
    font-family:'Spectral', serif;
    font-size:1rem;
    color:var(--text);
    width:100%;
    padding:6px 0;
  }
  #search::placeholder{color:var(--text-soft); font-style:italic;}

  .tabs{
    display:flex;
    gap:4px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .tab{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--parchment-2);
    background:var(--ink-2);
    border:1px solid var(--parchment-shadow);
    border-bottom:none;
    padding:9px 16px 8px;
    cursor:pointer;
    clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);
    transition:transform .15s ease, color .15s ease, background .15s ease;
  }
  .tab:hover{transform:translateY(-2px); color:var(--gold-bright);}
  .tab.active{
    background:var(--parchment);
    color:var(--ink);
    font-weight:600;
    transform:translateY(-2px);
  }
  .tab:focus-visible, #search:focus-visible, .card:focus-visible, .close-btn:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:2px;
  }

  /* ---------- Grid ---------- */
  .count{
    max-width:1100px;
    margin:22px auto 0;
    padding:0 26px;
    font-family:'JetBrains Mono', monospace;
    font-size:.75rem;
    color:var(--parchment-2);
    opacity:.7;
    letter-spacing:.05em;
  }
  .grid{
    max-width:1100px;
    margin:14px auto 80px;
    padding:0 24px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:20px;
  }

  .card{
    background:var(--parchment);
    color:var(--text);
    border:1px solid var(--parchment-shadow);
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    padding:18px 16px 16px;
    cursor:pointer;
    position:relative;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:transform .18s ease, box-shadow .18s ease;
    text-align:left;
  }
  .card:hover{transform:translateY(-4px); box-shadow:0 14px 26px rgba(0,0,0,.45);}
  .card::after{
    content:"";
    position:absolute; inset:6px;
    border:1px solid var(--parchment-shadow);
    opacity:.5;
    pointer-events:none;
  }
  .entry-no{
    font-family:'JetBrains Mono', monospace;
    font-size:.7rem;
    color:var(--text-soft);
    letter-spacing:.05em;
  }
  .card h3{
    font-family:'Cinzel', serif;
    font-size:1.15rem;
    margin:0;
    color:var(--ink);
  }
  .card p.tagline{
    margin:0;
    font-size:.88rem;
    font-style:italic;
    color:var(--text-soft);
    line-height:1.4;
  }
  .seal{
    position:absolute;
    top:10px;
    right:10px;
    width:38px;
    height:38px;
  }
  .badge-row{margin-top:auto; display:flex; gap:6px; flex-wrap:wrap;}
  .badge{
    font-family:'JetBrains Mono', monospace;
    font-size:.65rem;
    letter-spacing:.04em;
    padding:3px 7px;
    border-radius:var(--radius);
    text-transform:uppercase;
  }
  .badge.monster{background:var(--crimson); color:#f6e9e9;}
  .badge.npc{background:var(--violet); color:#f1eaf7;}
  .badge.ort{background:var(--forest); color:#e9f3ea;}
  .badge.gegenstand{background:var(--gold); color:#2c2213;}

  .empty{
    max-width:1100px; margin:40px auto; padding:0 24px;
    text-align:center; color:var(--parchment-2); font-style:italic;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,7,4,.75);
    backdrop-filter:blur(2px);
    display:none;
    align-items:center; justify-content:center;
    padding:24px;
    z-index:10;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--parchment);
    color:var(--text);
    max-width:560px; width:100%;
    max-height:86vh; overflow-y:auto;
    padding:34px 30px 30px;
    position:relative;
    box-shadow:0 30px 70px rgba(0,0,0,.6);
    border:1px solid var(--parchment-shadow);
  }
  .close-btn{
    position:absolute; top:14px; right:14px;
    background:none; border:none; cursor:pointer;
    font-family:'JetBrains Mono', monospace;
    font-size:1.1rem; color:var(--text-soft);
    line-height:1; padding:6px;
  }
  .close-btn:hover{color:var(--crimson);}
  .sheet .entry-no{margin-bottom:6px; display:block;}
  .sheet h2{
    font-family:'Cinzel', serif;
    font-size:1.7rem;
    margin:0 0 4px;
    color:var(--ink);
  }
  .sheet .tagline{font-size:.95rem; margin-bottom:18px;}
  .stat-block{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(90px,1fr));
    gap:10px;
    background:rgba(0,0,0,.05);
    border:1px solid var(--parchment-shadow);
    padding:12px;
    margin-bottom:18px;
  }
  .stat{text-align:center;}
  .stat .k{font-family:'JetBrains Mono', monospace; font-size:.62rem; text-transform:uppercase; color:var(--text-soft); letter-spacing:.06em;}
  .stat .v{font-family:'Cinzel', serif; font-weight:700; font-size:1rem; margin-top:2px;}
  .sheet .desc{line-height:1.65; font-size:.98rem;}
  .sheet .desc + .desc{margin-top:10px;}
  .field-label{
    font-family:'JetBrains Mono', monospace;
    font-size:.65rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--text-soft); margin:16px 0 4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; scroll-behavior:auto !important;}
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Bestiarium &middot; Chronik &middot; Schatzkammer</p>
  <h1 id="campaignTitle">Kompendium der Kampagne</h1>
  <p class="subtitle">Ein lebendes Verzeichnis aller Wesen, Orte und Wunder, denen wir begegnet sind</p>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Nach Namen oder Stichwort suchen …" autocomplete="off">
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<p class="count" id="count"></p>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" style="display:none;">Keine Einträge gefunden. Versuch einen anderen Suchbegriff.</p>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script>
/* ============================================================
   INHALT BEARBEITEN
   Trage hier deine eigenen Kampagnen-Einträge ein.
   category: "monster" | "npc" | "ort" | "gegenstand"
   ============================================================ */
const CAMPAIGN_NAME = "Kompendium der Kampagne"; // <- eigenen Kampagnennamen eintragen
document.getElementById('campaignTitle').textContent = CAMPAIGN_NAME;

const ENTRIES = [
   {
    category:"ort",
    name:"Caelreth",
    tagline:"Eine Hafenstadt am Hang, in der die Legenden dichter stehen als die Häuser.",
    region:"Abgelegene Insel", bekannt_fuer:"Fischfang, Bootsbau, Handel",
    desc:[
      "Caelreth ist eine kleine Hafenstadt auf einer abgelegenen Insel. Der Platz ist begrenzt, deshalb wächst die Stadt dicht am Hang des Gebirges entlang. Die Häuser stehen eng, viele auf Steinfundamenten direkt über dem Wasser.",
      "Die Bewohner leben hauptsächlich vom Fischfang, vom Bootsbau und vom Handel mit vorbeiziehenden Schiffen. Wer hier aufwächst, kann segeln, bevor er richtig schreiben kann.",
      "Trotz ihrer Größe wirkt die Stadt älter, als sie sein sollte. Zwischen Hafen und Berg halten sich hartnäckige Geschichten über das Meer, den Wald und den alten Glockenturm.",
      "<strong>Zwillingsfels</strong> — Im Westen der Stadt liegt ein Strand, auf dem zwei Felsen nebeneinander stehen und zur richtigen Tageszeit einen herzförmigen Schatten werfen. Paare binden rote Bänder zwischen den beiden Felsen — hängen sie nach drei Tagen noch, sagt man, seien die beiden füreinander bestimmt.",
      "<strong>Leuchtende Brücke</strong> — Gerüchten zufolge leuchtet es nachts bei Vollmond blau unter der Brücke im Osten der Insel. Wer sie zu dieser Zeit überquert, taucht angeblich erst Wochen später wieder auf — ohne zu wissen, was geschehen ist.",
      "<strong>Der „warme“ Steinbruch</strong> — Im kleinen Hügelgebiet nahe der Stadt liegt ein alter, teilweise aufgegebener Steinbruch. Manche Steine fühlen sich selbst im Winter leicht warm an, und Bergarbeiter schwören, schon einmal ein dumpfes Pochen gehört zu haben.",
      "<strong>Der Mann ohne Schatten</strong> — Alle paar Jahre erzählt jemand, am Hafen einen Mann gesehen zu haben, der bei Sonnenuntergang keinen Schatten wirft. Er kauft nichts, verkauft nichts, steht nur da und schaut aufs Meer. Am nächsten Tag ist er verschwunden.",
      "<strong>Die Steintreppe im Gebirge</strong> — Oberhalb der Stadt führt eine alte, halb verfallene Steintreppe ins Gebirge. Niemand weiß, wer sie gebaut hat, und sie endet abrupt an einer Felswand. Wer sie ganz hochgeht, soll in derselben Nacht von einer Tür im Stein träumen — gefunden hat diese Tür bisher niemand."
    ]
  },
  {
    category:"monster",
    name:"Death Bringer",
    tagline:"Eine Riesige Alte Defekt Aussehende Maschine",
    cr:"CR -", ac:"-", hp:"-", speed:"-",
    desc:["Bekannt Aus Denn Waste Lands.",
          "Kein Heiles Exemplar Bekannt"]
  },
  {
    category:"npc",
    name:"Good Man Ralf",
    tagline:"Alter Fremdenführer Aus Caelreth",
    rolle:"Verbündeter", status:"Lebendig", ort:"Caelreth",
    desc:["Bekannt Für Seine Freundlichkeit zu Neuen Menschen",
          "Weiß mehr über Die Halb Insel Als Jeder Andere"]
  },
  {
    category:"gegenstand",
    name:"Alter Kristall",
    tagline:"Ein alter Kristall, der elektrisch geladen zu sein scheint.",
    seltenheit:"Selten", attunement:"Nein",
    desc:["Komment aus Einer Alten Zeit, Besitzt 1 Energy charge Der Ein Kleines Elektronisches Objekt laden kann oder einmalich 2d6 Lightning DMG macht"]
  }
];

/* ============================================================
   Ab hier: Logik. Normalerweise nichts anpassen nötig.
   ============================================================ */
const CATEGORY_META = {
  alle:        {label:"Alle"},
  monster:     {label:"Monster",     badge:"Monster"},
  npc:         {label:"NPCs",        badge:"NPC"},
  ort:         {label:"Orte",        badge:"Ort"},
  gegenstand:  {label:"Gegenstände", badge:"Gegenstand"}
};

const SEALS = {
  monster: `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#8c2a34" stroke-width="1.5"/><path d="M10 12 L20 28 M17 10 L25 26 M24 11 L30 24" stroke="#8c2a34" stroke-width="2" stroke-linecap="round" fill="none"/></svg>`,
  npc: `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#5a4470" stroke-width="1.5"/><path d="M14 28 L24 12 M24 12 L26 16 L22 17 Z" stroke="#5a4470" stroke-width="1.6" fill="#5a4470" stroke-linejoin="round"/></svg>`,
  ort: `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#3c5b3f" stroke-width="1.5"/><circle cx="20" cy="20" r="3" fill="#3c5b3f"/><path d="M20 8 L22 18 L20 20 L18 18 Z M20 32 L22 22 L20 20 L18 22 Z M8 20 L18 18 L20 20 L18 22 Z M32 20 L22 22 L20 20 L22 18 Z" fill="#3c5b3f"/></svg>`,
  gegenstand: `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#bd9330" stroke-width="1.5"/><path d="M13 17 L20 10 L27 17 L23 29 L17 29 Z" fill="none" stroke="#bd9330" stroke-width="1.6" stroke-linejoin="round"/></svg>`
};

let activeCategory = "alle";
let searchTerm = "";

const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');

function buildTabs(){
  Object.entries(CATEGORY_META).forEach(([key, meta])=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (key === activeCategory ? ' active' : '');
    btn.textContent = meta.label;
    btn.setAttribute('data-cat', key);
    btn.addEventListener('click', ()=>{
      activeCategory = key;
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
    tabsEl.appendChild(btn);
  });
}

function fieldsFor(entry){
  switch(entry.category){
    case "monster": return [["HG", entry.cr],["RK", entry.ac],["TP", entry.hp],["Tempo", entry.speed]];
    case "npc": return [["Rolle", entry.rolle],["Status", entry.status],["Ort", entry.ort]];
    case "ort": return [["Region", entry.region],["Bekannt für", entry.bekannt_fuer]];
    case "gegenstand": return [["Seltenheit", entry.seltenheit],["Attunement", entry.attunement]];
    default: return [];
  }
}

function matches(entry){
  const inCat = activeCategory === "alle" || entry.category === activeCategory;
  const term = searchTerm.trim().toLowerCase();
  const inSearch = !term ||
    entry.name.toLowerCase().includes(term) ||
    entry.tagline.toLowerCase().includes(term) ||
    entry.desc.join(' ').toLowerCase().includes(term);
  return inCat && inSearch;
}

function render(){
  const filtered = ENTRIES.filter(matches);
  gridEl.innerHTML = "";
  emptyEl.style.display = filtered.length ? "none" : "block";
  countEl.textContent = `${filtered.length} von ${ENTRIES.length} Einträgen`;

  filtered.forEach((entry, i)=>{
    const idx = ENTRIES.indexOf(entry);
    const card = document.createElement('button');
    card.className = 'card';
    card.setAttribute('type','button');
    card.innerHTML = `
      <span class="seal">${SEALS[entry.category]}</span>
      <span class="entry-no">N° ${String(idx+1).padStart(3,'0')}</span>
      <h3>${entry.name}</h3>
      <p class="tagline">${entry.tagline}</p>
      <div class="badge-row"><span class="badge ${entry.category}">${CATEGORY_META[entry.category].badge}</span></div>
    `;
    card.addEventListener('click', ()=>openSheet(idx));
    gridEl.appendChild(card);
  });
}

function openSheet(idx){
  const entry = ENTRIES[idx];
  const fields = fieldsFor(entry);
  sheet.innerHTML = `
    <button class="close-btn" aria-label="Schließen">✕ Schließen</button>
    <span class="entry-no">N° ${String(idx+1).padStart(3,'0')} &middot; ${CATEGORY_META[entry.category].badge}</span>
    <h2>${entry.name}</h2>
    <p class="tagline">${entry.tagline}</p>
    ${fields.length ? `<div class="stat-block">${fields.map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v || '—'}</div></div>`).join('')}</div>` : ''}
    <div class="field-label">Einträge in der Chronik</div>
    ${entry.desc.map(d=>`<p class="desc">${d}</p>`).join('')}
  `;
  sheet.querySelector('.close-btn').addEventListener('click', closeSheet);
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSheet(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeSheet(); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeSheet(); });
document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  render();
});

buildTabs();
render();
</script>
</body>
</html>
